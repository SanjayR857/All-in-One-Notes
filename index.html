<!DOCTYPE html>
<html lang="en" data-theme="light" data-width="readable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Markdown Notes Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top Command Header -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <a href="#" id="brand-home" class="brand" title="Go to repository home">
        <svg class="brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span id="repo-badge" class="brand-title">All-in-One-Notes</span>
      </a>
    </div>

    <form id="url-form" class="url-bar" autocomplete="off">
      <svg class="url-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <input
        id="github-url-input"
        type="url"
        placeholder="Paste any GitHub repo, folder, or .md file URL..."
        aria-label="GitHub URL"
        spellcheck="false"
      />
      <button type="submit" class="load-btn">Load</button>
    </form>

    <div class="topbar-actions">
      <button id="quick-search-btn" class="action-pill" title="Quick find file (Ctrl+K)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Search</span>
        <kbd>Ctrl K</kbd>
      </button>

      <button id="width-toggle" class="icon-btn" title="Toggle reading width" aria-label="Toggle reading width">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8l4 4-4 4"/><path d="M7 8l-4 4 4 4"/><path d="M3 12h18"/></svg>
      </button>

      <button id="theme-toggle" class="icon-btn" title="Cycle theme (Light / Dark / Sepia)" aria-label="Cycle theme">
        <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>

      <button id="settings-btn" class="icon-btn" title="GitHub settings & token" aria-label="GitHub settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

      <a id="open-github-link" class="icon-btn" href="https://github.com/SanjayR857/All-in-One-Notes" target="_blank" rel="noopener noreferrer" title="View on GitHub">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop -->
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

  <!-- 3-Pane Workspace -->
  <div class="workspace">
    <!-- Left Sidebar: File Tree -->
    <aside id="sidebar" class="sidebar" aria-label="Repository Explorer">
      <div class="sidebar-header">
        <div class="tree-filter-wrap">
          <input id="tree-filter" type="search" placeholder="Filter notes..." aria-label="Filter repository files" />
        </div>
        <button id="refresh-tree-btn" class="icon-btn small" title="Refresh file tree from GitHub" aria-label="Refresh file tree">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>
      <div id="tree-status" class="tree-status"></div>
      <nav id="file-tree" class="file-tree"></nav>
    </aside>

    <!-- Center Pane: Markdown Reader -->
    <main id="reader-pane" class="reader-pane">
      <div class="reader-container">
        <div class="doc-toolbar">
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
          <div class="doc-actions">
            <button id="copy-raw-btn" class="ghost-btn hidden" title="Copy raw Markdown">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              <span>Copy MD</span>
            </button>
            <button id="toc-mobile-btn" class="ghost-btn hidden" title="Table of Contents">
              <span>Outline</span>
            </button>
          </div>
        </div>

        <!-- Frontmatter Card -->
        <section id="frontmatter-card" class="frontmatter-card hidden"></section>

        <!-- Loading / Error Banner -->
        <div id="status-banner" class="status-banner hidden"></div>

        <!-- Rendered Document or Home Dashboard -->
        <article id="markdown-body" class="markdown-body"></article>

        <!-- Prev / Next Footer -->
        <nav id="doc-pager" class="doc-pager hidden" aria-label="Sequential page navigation"></nav>
      </div>
    </main>

    <!-- Right Sidebar: On This Page TOC -->
    <aside id="toc-sidebar" class="toc-sidebar" aria-label="On this page">
      <div class="toc-title">On This Page</div>
      <nav id="toc-list" class="toc-list"></nav>
    </aside>
  </div>

  <!-- Quick Switcher Modal (Ctrl+K) -->
  <div id="search-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Quick search">
    <div class="modal-backdrop" data-close="search-modal"></div>
    <div class="modal-panel search-panel">
      <div class="search-input-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="quick-search-input" type="text" placeholder="Jump to any note by name or path..." autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <ul id="quick-search-results" class="search-results"></ul>
    </div>
  </div>

  <!-- Mermaid Zoom Modal -->
  <div id="mermaid-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Diagram viewer">
    <div class="modal-backdrop" data-close="mermaid-modal"></div>
    <div class="modal-panel mermaid-panel">
      <div class="mermaid-modal-bar">
        <span>Diagram Inspector</span>
        <div class="mermaid-zoom-controls">
          <button id="zoom-out-btn" class="ghost-btn" title="Zoom out">−</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in-btn" class="ghost-btn" title="Zoom in">+</button>
          <button id="zoom-reset-btn" class="ghost-btn" title="Reset zoom">Reset</button>
          <button class="ghost-btn" data-close="mermaid-modal">Close</button>
        </div>
      </div>
      <div id="mermaid-modal-stage" class="mermaid-modal-stage"></div>
    </div>
  </div>

  <!-- Settings / PAT Modal -->
  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="GitHub settings">
    <div class="modal-backdrop" data-close="settings-modal"></div>
    <div class="modal-panel settings-panel">
      <div class="settings-header">
        <h3>GitHub Viewer Settings</h3>
        <button class="ghost-btn" data-close="settings-modal">Close</button>
      </div>
      <div class="settings-body">
        <label class="field-label" for="pat-input">
          GitHub Personal Access Token (optional)
        </label>
        <p class="field-help">
          Stored only in your browser's <code>localStorage</code>. Useful if you exceed GitHub's 60 requests/hour anonymous API limit or want to read private repositories.
        </p>
        <input id="pat-input" type="password" placeholder="ghp_... or github_pat_..." autocomplete="off" />

        <div class="settings-actions">
          <button id="save-settings-btn" class="load-btn">Save Settings</button>
          <button id="clear-cache-btn" class="ghost-btn">Clear Cached Trees</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.3.0/dist/mermaid.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
